name: release

# A v* tag, pushed by .github/tag-release.sh, releases that commit: it runs the CI
# matrix again and publishes a GitHub Release holding the source tarball and its
# SHA-256, with the tag's CHANGELOG.md section as the notes. The Release is created
# last, so it exists only once everything before it has passed. The benchmark
# comparison with the previous release runs in tag-release.sh, on the machine that
# tags: GitHub's shared runners are too noisy for it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    name: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches VERSION and CHANGELOG.md
        id: version
        run: |
          VERSION="$(cat VERSION)"
          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION ${VERSION}"
              exit 1
          fi
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no section for ${VERSION}"
              exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  test:
    needs: check
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [check, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Source tarball
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          git archive --format=tar.gz --prefix="simdfix-${VERSION}/" \
              -o "simdfix-${VERSION}.tar.gz" "${GITHUB_REF_NAME}"
          sha256sum "simdfix-${VERSION}.tar.gz" > "simdfix-${VERSION}.tar.gz.sha256"

      - name: Release notes
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          awk -v heading="## [${VERSION}]" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found
          ' CHANGELOG.md > notes.md
          test -s notes.md

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "simdfix ${VERSION}" --notes-file notes.md \
              "simdfix-${VERSION}.tar.gz" "simdfix-${VERSION}.tar.gz.sha256"
